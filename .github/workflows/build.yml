name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: manager-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Catalog screenshots are reachable and valid
        run: npm run check:screenshots
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx playwright install chromium
      - run: npm run test:ui
  package:
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:${{ matrix.target }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:package
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: manager-${{ matrix.target }}
          path: release/*.exe
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [check, package]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        shell: bash
        run: sha256sum * > SHA256SUMS.txt
      - name: Sign checksums
        if: env.APP_UPDATE_SIGNING_KEY != ''
        working-directory: artifacts
        env:
          APP_UPDATE_SIGNING_KEY: ${{ secrets.APP_UPDATE_SIGNING_KEY }}
        run: |
          node -e "import { sign } from 'node:crypto'; import { readFileSync, writeFileSync } from 'node:fs'; writeFileSync('SHA256SUMS.txt.sig', sign(null, readFileSync('SHA256SUMS.txt'), process.env.APP_UPDATE_SIGNING_KEY));"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            Install, update and manage Alan Marcero's audio plugins directly from GitHub Releases.

            Windows: download the x64 setup EXE. This build is unsigned, so Windows may show a publisher warning.
            macOS and Linux prebuilt packages are disabled for now; build from source using the README.
